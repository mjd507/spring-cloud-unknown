# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      run_jacoco_badge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      with:
        cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
        cache-cleanup: on-success

    - name: Check with Gradle Wrapper
      run: ./gradlew check

    - name: Generate JaCoCo Badge for gateway
      if: env.run_jacoco_badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: gateway/build/reports/jacoco/test/jacocoTestReport.csv

    - name: Generate JaCoCo Badge for config-server
      if: env.run_jacoco_badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: config-server/build/reports/jacoco/test/jacocoTestReport.csv

